<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">How SiloAgents protects private knowledge while preserving useful answers</title>
  <desc id="desc">A user question is split into clauses, routed to isolated domain agents, sanitized by a policy gateway, and returned with provenance. Unsafe baselines are compared against the policy-gated architecture.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#eef7f3"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#45627a"/></marker>
  </defs>
  <rect width="1200" height="520" rx="24" fill="url(#bg)"/>
  <text x="50" y="55" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#17324d">Safe multi-agent collaboration, measured end to end</text>
  <text x="50" y="88" font-family="Inter,Arial,sans-serif" font-size="17" fill="#48647c">One local LLM, isolated knowledge, deterministic policy checks, reproducible benchmarks.</text>

  <g filter="url(#shadow)">
    <rect x="50" y="135" width="180" height="120" rx="18" fill="#ffffff" stroke="#7aa7c7"/>
    <text x="140" y="174" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#17324d">1. User question</text>
    <text x="140" y="207" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#48647c">“Assess cooling,</text>
    <text x="140" y="228" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#48647c">pump risk and margin”</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="285" y="135" width="190" height="120" rx="18" fill="#ffffff" stroke="#7aa7c7"/>
    <text x="380" y="174" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#17324d">2. Clause routing</text>
    <text x="380" y="205" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#48647c">Each aspect is routed</text>
    <text x="380" y="226" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#48647c">independently</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="530" y="112" width="220" height="166" rx="18" fill="#ffffff" stroke="#60a58f"/>
    <text x="640" y="145" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#17324d">3. Isolated agents</text>
    <rect x="553" y="164" width="174" height="28" rx="10" fill="#e6f4ef"/><text x="640" y="184" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#255e4c">Process RAG</text>
    <rect x="553" y="201" width="174" height="28" rx="10" fill="#e6f4ef"/><text x="640" y="221" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#255e4c">Maintenance RAG</text>
    <rect x="553" y="238" width="174" height="28" rx="10" fill="#e6f4ef"/><text x="640" y="258" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#255e4c">Economics RAG</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="805" y="135" width="170" height="120" rx="18" fill="#ffffff" stroke="#d19a45"/>
    <text x="890" y="174" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#17324d">4. Policy Gateway</text>
    <text x="890" y="205" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#48647c">Redacts secrets,</text>
    <text x="890" y="226" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#48647c">requires provenance</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1030" y="135" width="120" height="120" rx="18" fill="#ffffff" stroke="#7aa7c7"/>
    <text x="1090" y="174" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#17324d">5. Answer</text>
    <text x="1090" y="205" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#48647c">Useful facts</text>
    <text x="1090" y="226" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#48647c">without secrets</text>
  </g>

  <g stroke="#45627a" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M230 195 H280"/><path d="M475 195 H525"/><path d="M750 195 H800"/><path d="M975 195 H1025"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="50" y="330" width="1100" height="135" rx="18" fill="#ffffff" stroke="#c8d7e4"/>
    <text x="80" y="370" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#17324d">What the repository gives you</text>
    <text x="80" y="407" font-family="Inter,Arial,sans-serif" font-size="15" fill="#48647c">✓ Three comparable architectures: shared RAG, isolated RAG, policy-gated agents</text>
    <text x="80" y="435" font-family="Inter,Arial,sans-serif" font-size="15" fill="#48647c">✓ Security metrics: leakage, contamination, abstention, provenance</text>
    <text x="620" y="407" font-family="Inter,Arial,sans-serif" font-size="15" fill="#48647c">✓ Utility metrics: fact coverage, safe success, useful facts per 1k tokens</text>
    <text x="620" y="435" font-family="Inter,Arial,sans-serif" font-size="15" fill="#48647c">✓ Blind A/B/C review packet for human evaluation</text>
  </g>
</svg>
