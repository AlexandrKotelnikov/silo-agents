[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "silo-agents"
version = "0.4.0"
description = "Policy-governed collaboration between AI agents with isolated RAG, memory, and tools"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Alexander Kotelnikov"}]
dependencies = ["pydantic>=2.8,<3", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff==0.16.0", "mypy>=1.10"]

[project.scripts]
silo-agents-benchmark = "silo_agents.experiment:main"
silo-agents-health = "silo_agents.live:health_main"
silo-agents-ingest = "silo_agents.live:ingest_main"
silo-agents-live-run = "silo_agents.live:run_main"
silo-agents-live-benchmark = "silo_agents.live:benchmark_main"

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["integration: requires an external service such as Qdrant"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
