[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "silo-agents"
version = "1.0.0"
description = "Create and benchmark policy-governed AI agent systems from configuration"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Alexander Kotelnikov"}]
dependencies = ["pydantic>=2.8,<3", "httpx>=0.28,<1", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff==0.16.0", "mypy>=1.10", "types-PyYAML>=6.0"]

[project.scripts]
silo-agents = "silo_agents.workspace:main"
silo-agents-wizard = "silo_agents.wizard_cli:wizard_main"
silo-agents-audit = "silo_agents.wizard_cli:audit_main"
silo-agents-doctor = "silo_agents.wizard_cli:doctor_main"
silo-agents-benchmark = "silo_agents.experiment:main"
silo-agents-health = "silo_agents.live:health_main"
silo-agents-ingest = "silo_agents.live:ingest_main"
silo-agents-live-run = "silo_agents.live:run_main"
silo-agents-live-benchmark = "silo_agents.live:benchmark_main"
silo-agents-live-compare = "silo_agents.live_compare:main"
silo-agents-answer-utility = "silo_agents.answer_utility:main"
silo-agents-project-validate = "silo_agents.project_cli:validate_main"
silo-agents-project-run = "silo_agents.project_cli:run_main"

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["integration: requires an external service such as Qdrant"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
