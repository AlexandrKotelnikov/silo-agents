name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.18.3
        ports:
          - 6333:6333
    env:
      QDRANT_TEST_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Wait for Qdrant
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:6333/collections >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest -q
